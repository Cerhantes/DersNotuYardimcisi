# Kurulum betiklerini ve örnek PDF'leri Windows, Mac ve Linux'ta sınar.
name: kurulum
on: [push, workflow_dispatch]

jobs:
  sina:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        uv: ['', '1']   # '1' = Python'u olmayan makine: uv ile kur
    env:
      DERS_NOTU_UV: ${{ matrix.uv }}
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Kur
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File ortak/kur.ps1 | tee kur.log
          else
            bash ortak/kur.sh | tee kur.log
          fi
          tail -1 kur.log | grep '^PY='
          tail -1 kur.log | tr -d '\r' >> "$GITHUB_ENV"

      - name: Hazır ortamda hızlı dönüş
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File ortak/kur.ps1 | tee kur2.log
          else
            bash ortak/kur.sh | tee kur2.log
          fi
          test "$(wc -l < kur2.log)" -eq 1

      - name: Birim testleri
        run: '"$PY" -W ignore -m unittest discover -s tests -v'

      - name: Örnekleri derle
        run: |
          mkdir -p out/dn out/tn out/fk
          PYTHONPATH=skills/ders-notu/scripts "$PY" -W ignore skills/ders-notu/examples/ornek_ders_notu.py out/dn.pdf out/dn
          PYTHONPATH=skills/tekrar-notu/scripts "$PY" -W ignore skills/tekrar-notu/examples/ornek_tekrar_notu.py out/tn.pdf out/tn
          PYTHONPATH=skills/formul-kagidi/scripts "$PY" -W ignore skills/formul-kagidi/examples/ornek_semalar.py out/fk
          PYTHONPATH=skills/formul-kagidi/scripts "$PY" -W ignore skills/formul-kagidi/examples/ornek_kagit.py out/fk.pdf out/fk
          mkdir -p out/sk
          PYTHONPATH=skills/soru-kitapcigi/scripts "$PY" -W ignore skills/soru-kitapcigi/examples/ornek_hesap.py out/sk
          PYTHONPATH=skills/soru-kitapcigi/scripts "$PY" -W ignore skills/soru-kitapcigi/examples/ornek_soru_kitapcigi.py out/sk.pdf out/sk
          cp skills/soru-kitapcigi/examples/ornek_sorular.json out/sk/sorular.json
          "$PY" -W ignore skills/soru-kitapcigi/scripts/denetim.py out/sk.pdf out/sk | grep 'DENETİM TAMAM'
          test -s out/dn.pdf && test -s out/tn.pdf && test -s out/fk.pdf && test -s out/sk.pdf

      - name: Envanter ve sayfa farkı
        run: |
          "$PY" -W ignore ortak/envanter.py out/dn.pdf | grep 'Envanter henüz yok'
          "$PY" -W ignore ortak/envanter.py out/dn.pdf 1-2 --work out/env | grep 'Envanter kuruldu'
          test -s out/env/metin.txt
          "$PY" -W ignore ortak/envanter.py out/dn.pdf 1-2 | grep 'yeniden kullanılıyor'
          "$PY" -W ignore ortak/sayfa_fark.py out/dn.pdf out/fark | grep 'rv1.png'
          "$PY" -W ignore ortak/sayfa_fark.py out/dn.pdf out/fark | grep 'AÇILACAK: yok'
